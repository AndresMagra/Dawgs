<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>You're offline · Dawgs</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6f2; color: #1c2420; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #111412; color: #e8ece9; } p { color: #a3ada7; } }
      main { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #5b6660; margin: 0 0 20px; }
      button { font: inherit; font-weight: 600; padding: 12px 20px; min-height: 44px; border: 0; border-radius: 10px; background: #2f6f4f; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Dawgs needs a connection to show bookings and walks. It'll pick up where you left off once you're back online.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
  </body>
</html>
